name: 놓침·오탐 사례
description: 서비스가 개인정보를 놓쳤거나, 가리지 않아도 될 것을 가린 사례
title: "[사례] "
labels: ["사례"]
body:
  - type: markdown
    attributes:
      value: |
        **사진과 실제 글자를 올리지 마세요.** 저장소는 공개입니다. 사진은 팀 드라이브 `PrivacyLens-Eval/` 에 두고 파일 이름만 적습니다.
        글자를 보여 줘야 하면 같은 모양의 **가짜 값**으로 바꿔 적으세요(예: 010-0000-1234).
  - type: dropdown
    id: kind
    attributes:
      label: 종류
      options: ["놓침(가려야 하는데 안 가림)", "약함(확인 필요로만 나옴)", "오탐(가리면 안 되는데 가림)"]
    validations:
      required: true
  - type: dropdown
    id: cause
    attributes:
      label: 원인 (eval.failures 결과)
      options: ["① 못 찾음", "② 잘못 읽음", "③ 판단 실패", "모름"]
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: 항목
      placeholder: "이름 / 휴대폰 / 계좌번호 …"
  - type: input
    id: photo
    attributes:
      label: 드라이브 사진 이름
      placeholder: "실사-개발용/cy_007.jpg"
  - type: textarea
    id: repro
    attributes:
      label: 가짜 값으로 재현
      description: OCR 결과가 어땠는지 줄 단위로, 값은 가짜로. eval/judgment.py 장면으로 옮길 수 있게.
      placeholder: |
        받는분  (못 읽음)
        김가짜
        010-0000-1234
  - type: textarea
    id: note
    attributes:
      label: 메모
