# PR 마다 도는 자동 검사. 실패하면 PR 화면에 빨간 X 가 뜬다.
#   backend   : 백엔드 테스트 + 판단 회귀 검사(eval.judgment --check)
#   frontend  : 화면 점검 3종 + 빌드 결과(privacy-lens.html)가 커밋된 것과 같은지
#   synthetic : 합성 송장으로 OCR 까지 한 바퀴(Tesseract). 숫자는 참고용이라 실패해도 막지 않는다
# 실사 사진은 여기서 돌리지 않는다(저장소에 없고, 올리면 안 된다). 실사 평가는 eval/colab_eval.ipynb.
name: CI

# 같은 저장소 브랜치는 push 할 때 돈다(PR 화면에도 그 결과가 붙는다).
# 포크에서 온 PR 만 pull_request 로 돈다. 같은 커밋을 두 번 돌리지 않으려는 것.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: 백엔드 테스트 · 판단 회귀 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 한글 폰트
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - name: 패키지 설치
        run: python -m pip install -r requirements.txt
      - name: 테스트
        run: python -m pytest tests -q
      - name: 판단 회귀 검사
        run: |
          python -m eval.judgment --check | tee judgment.txt
          { echo '### 판단 평가 (가상 텍스트, OCR 완벽 가정)'; echo '```'; cat judgment.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: 화면 점검 · 빌드 일치
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - run: node scripts/check-contract.mjs
      - run: node scripts/build.mjs
      - name: 빌드 결과가 커밋돼 있는지
        run: |
          if ! git diff --quiet -- privacy-lens.html; then
            echo "::error::dist/ 를 고친 뒤 node scripts/build.mjs 결과(privacy-lens.html)를 같이 커밋하세요."
            git diff --stat -- privacy-lens.html
            exit 1
          fi

  synthetic:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: 합성 송장 한 바퀴 (Tesseract, 참고용)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tesseract · 한글 폰트
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - name: 합성 샘플 비교
        env:
          PL_OCR: tesseract
          PL_YOLO: "off"
          OMP_THREAD_LIMIT: "1"
        run: |
          python run.py --samples
          python -m eval.compare samples/out | tee compare.txt
          { echo '### 합성 송장 비교 (Tesseract) — 실사 숫자가 아님'; echo '```'; cat compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
